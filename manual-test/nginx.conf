worker_processes 1;
user nobody nogroup;
#daemon off;
error_log /dev/stderr debug;
pid /tmp/manual-test-nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout combined;

  # Docker Compose's embedded DNS -- resolves the `redis` service name, and
  # passes through to real external DNS for anything else (relevant if you
  # point this at a real domain -- see the README in this directory).
  resolver 127.0.0.11 ipv6=off valid=10s;

  lua_shared_dict auto_ssl 10m;
  lua_shared_dict auto_ssl_settings 64k;

  init_by_lua_block {
    ngx.log(ngx.NOTICE, "init_by_lua_block")

    local options = {
      dir = "/etc/resty-auto-ssl",
      ca = "https://acme-staging-v02.api.letsencrypt.org/directory",
      storage_adapter = "resty.auto-ssl.storage_adapters.redis",

      -- Wide open for manual testing -- do not use this in any real
      -- deployment. Swap in your own logic (or an allowlist) if you point
      -- this at a real, publicly reachable domain.
      allow_domain = function(domain)
        return true
        -- go check a db or owned domain storage kind of logic ...
      end,

      -- --- redis storage adapter options
      -- (lib/resty/auto-ssl/storage_adapters/redis.lua) ---
      redis = {
        host = "redis", -- the `redis` compose service, see docker-compose.yml
        port = 6379,
        auth = "manual-test-secret", -- matches the redis service's --requirepass
        db = 1,
        prefix = "manual-test", -- also what scripts/*.sh's REDIS_KEY_PREFIX should be set to
        -- Connect/send/read timeouts and keepalive pool sizing -- see the
        -- "Redis connection lifecycle fix" entry in FORKCHANGES.md.
        timeouts = {
          conn = 3000,
          send = 3000,
          read = 3000,
        },
        keepalive = {
          keepalive_duration = 300000, -- 5m
          pool_size = 10,
        },
        connect_options = {
          pool_size = 5,
        },
      },

      -- --- storage TTL / expiry options (lib/resty/auto-ssl/storage.lua) --
      -- these five interact; see FORKCHANGES.md's "Configurable storage
      -- TTLs" entry for the full rationale before changing any one of them ---
      challenge_keys_exptime = 3600,           -- 1h: ACME challenge token TTL
      ssl_certs_keys_exptime = 7776000,        -- 90d: nominal cert TTL, only used as-is by expire mode 1
      ssl_certs_keys_expire_mode = 2,          -- 0 = no TTL, 1 = flat TTL, 2 = per-cert real expiry (default)
      renew_offset_ssl_certs_exptime = 86400,  -- 1d: buffer subtracted so storage outlives the cert by this much
      min_ssl_certs_exptime = 86400,           -- 1d: floor if that subtraction goes non-positive

      -- --- renewal job options (lib/resty/auto-ssl/jobs/renewal.lua) ---
      renew_age_days = 30,                     -- renew once a cert is within this many days of expiring
      -- Internal schedule off -- trigger renewal passes on demand instead,
      -- any time, via GET /manual-renew.
      enable_internal_renew_schedule = false,
      renew_check_interval = 60,

      -- The feature this whole setup exists to let you poke at manually --
      -- see FORKCHANGES.md's "Features & cutomizations: wave #2" section.
      enable_redis_sorted_list_renewal = true,
    }
    auto_ssl = (require "resty.auto-ssl").new(options)
    auto_ssl:init()
  }

  init_worker_by_lua_block {
    auto_ssl:init_worker()
  }

  # Fallback cert for any domain auto-ssl hasn't (yet, or ever) issued a real
  # one for -- reusing the same disposable cert the spec suite uses.
  ssl_certificate /app/spec/certs/example_fallback.crt;
  ssl_certificate_key /app/spec/certs/example_fallback.key;

  server {
    listen 9443 ssl;
    ssl_certificate_by_lua_block {
      auto_ssl:ssl_certificate()
    }

    location / {
      content_by_lua_block {
        ngx.say("ok")
      }
    }
  }

  server {
    listen 9080;

    location /.well-known/acme-challenge/ {
      content_by_lua_block {
        auto_ssl:challenge_server()
      }
    }

    # Not part of the real library's API -- a convenience for manual testing
    # only, so you can trigger a renewal pass on demand instead of waiting
    # out renew_check_interval. Mirrors the manual-renewal usage documented
    # in FORKCHANGES.md.
    location /manual-renew {
      content_by_lua_block {
        local renewal = require "resty.auto-ssl.jobs.renewal"
        renewal.do_renew(auto_ssl)
        ngx.say("renewal cycle triggered -- check the container logs")
      }
    }

    location /hook-server-secret {
      content_by_lua_block {
        ngx.print(ngx.shared.auto_ssl_settings:get("hook_server:secret"))
      }
    }

    location / {
      return 403;
    }
  }

  server {
    listen 127.0.0.1:8999;
    location / {
      content_by_lua_block {
        auto_ssl:hook_server()
      }
    }
  }
}
